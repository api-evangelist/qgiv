aid: qgiv
url: https://raw.githubusercontent.com/api-evangelist/qgiv/refs/heads/main/apis.yml
name: Qgiv
kind: company
description: Qgiv (now Bloomerang Fundraising) is an online donation, event registration,
  peer-to-peer fundraising, and payment processing platform for nonprofits, faith-based
  organizations, and schools. Qgiv was acquired by Bloomerang in January 2024 and now
  operates as Bloomerang's giving platform; the legacy Qgiv API documentation lives at
  qgiv.com/api and remains the documented programmatic surface for existing Qgiv
  forms and accounts. The API is a token-authenticated, form-scoped REST-style service
  at secure.qgiv.com/admin/api that accepts XML or JSON input and returns XML or JSON
  based on the URL extension, covering transactions, recurring donations, refunds,
  peer-to-peer registrations, events, account settings, custom fields, custom amounts,
  statements, and report mappings.

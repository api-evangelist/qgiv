    - POST https://secure.qgiv.com/admin/api/customFields/create
    - GET/POST https://secure.qgiv.com/admin/api/amounts/list
    - GET/POST https://secure.qgiv.com/admin/api/amounts/{id}
    - POST https://secure.qgiv.com/admin/api/amounts/create
    - POST https://secure.qgiv.com/admin/api/reporting/statements/list
    - POST https://secure.qgiv.com/admin/api/reporting/statements/latest
    - POST https://secure.qgiv.com/admin/api/reporting/statements/{id}

sources:
  - url: https://www.qgiv.com/api/
    type: Documentation
    note: Full documentation sitemap - Forms, Reporting, and Variables sections, all HTTP request/response.
  - url: https://www.qgiv.com/api/index.php
    type: Documentation
    note: Overview confirms token-based auth via POST data and XML/JSON-only input/output; no WebSocket mentioned.
  - url: https://www.qgiv.com/api/reporting-transactions.php
    type: APIReference
    note: Transactions endpoints are plain HTTP GET/POST; no streaming or push variant documented.
  - url: https://www.qgiv.com/api/events.php
    type: APIReference
    note: Events endpoints use HTTP POST with token/package; PHP cURL example shown is synchronous request/response.
  - url: https://www.qgiv.com/blog/bloomerang-acquires-qgiv/
    type: Documentation
    note: Confirms Bloomerang acquired Qgiv (announced/closed around January 2024); qgiv.com/pricing now redirects to bloomerang.com/pricing.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket or other server-push protocol surface exists on Qgiv's
    documented API. No AsyncAPI document was created because Qgiv's own
    public API is exclusively request/response HTTP with no push/streaming
    transport to model, and no first-party webhook subscription endpoint is
    documented to model as an alternative.

description: >-
  FinOps view of Qgiv (Bloomerang Fundraising) spend. Cost has two components:
  a recurring software subscription (historically as low as $0/month on a
  legacy starter tier, now sold post-acquisition as part of a Bloomerang
  bundle starting around $40/month billed annually) and per-transaction
  payment processing fees (third-party reported around 2.95%-3.95% + $0.30 per
  transaction) charged on donations, event registrations, and peer-to-peer
  gifts processed through Qgiv forms. GiftAssist lets a nonprofit shift some or
  all of the processing-fee burden to the donor by prompting a voluntary
  fee-offset contribution, which is a cost-avoidance lever unique to donation
  platforms. The documented qgiv.com/api itself carries no separate metered
  fee - it is included with the account and is not a distinct cost driver
  beyond the underlying subscription and processing fees.
notes: >-
  Per-unit software and processing rates are not fully reconciled here - they
  are drawn from third-party pricing-comparison sources rather than a current
  first-party rate sheet, since qgiv.com/pricing now redirects to
  bloomerang.com/pricing and displays bundle pricing rather than legacy Qgiv
  standalone rates. Nonprofits should request a current rate sheet from
  Bloomerang sales and track GiftAssist offset rates as an explicit
  cost-avoidance metric.

meters:
- name: software_subscription
  description: Recurring monthly/annual software subscription fee for the giving platform tier.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - tier
- name: processing_fee
  description: Per-transaction payment processing fee charged on donations, event registrations, and peer-to-peer gifts.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - form
  - payment_method
- name: giftassist_offset
  description: Voluntary donor contribution collected via GiftAssist to offset processing fees; reduces net processing cost to the nonprofit.
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - form
- name: refund_volume
  description: Value of refunded transactions, relevant to reconciling net processing cost against gross volume.
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - form
principles:
- name: Visibility
  description: Reconcile the monthly Statements API output (amountContributed, percentage, transactionFees) against the bank deposit to track true processing cost per period.
- name: Allocation
  description: Track cost per form/campaign using form-scoped API tokens so subscription and processing costs map to the program or campaign generating them.
- name: Optimization
  description: Enable and tune GiftAssist to shift processing-fee burden to willing donors; monitor refund volume, which erodes net revenue without necessarily reducing the processing fee already charged.
- name: Accountability
  description: Assign a program owner to review the monthly statement and recurring-donation forecast so subscription tier and processing volume stay matched to actual fundraising activity.
